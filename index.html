<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Valentine's Question</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .photo-collage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            padding: 10px;
            opacity: 0.3;
            overflow: hidden;
        }

        .photo-collage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        /* More balanced sizes for different images */
        .photo-collage img:nth-child(1) { grid-area: 1 / 1 / 2 / 2; }
        .photo-collage img:nth-child(2) { grid-area: 1 / 2 / 2 / 3; }
        .photo-collage img:nth-child(3) { grid-area: 1 / 3 / 3 / 5; } /* Larger */
        .photo-collage img:nth-child(4) { grid-area: 2 / 1 / 3 / 3; } /* Wider */
        .photo-collage img:nth-child(5) { grid-area: 3 / 1 / 4 / 2; }
        .photo-collage img:nth-child(6) { grid-area: 3 / 2 / 4 / 3; }
        .photo-collage img:nth-child(7) { grid-area: 3 / 3 / 4 / 4; }
        .photo-collage img:nth-child(8) { grid-area: 3 / 4 / 4 / 5; }
        .photo-collage img:nth-child(9) { grid-area: 4 / 1 / 5 / 2; }
        .photo-collage img:nth-child(10) { grid-area: 4 / 2 / 5 / 3; }
        .photo-collage img:nth-child(11) { grid-area: 4 / 3 / 5 / 4; }
        .photo-collage img:nth-child(12) { grid-area: 4 / 4 / 5 / 5; }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            margin: 20px;
        }

        h1 {
            color: #ff4b6e;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.1);
        }

        #yesBtn {
            background-color: #ff4b6e;
            color: white;
        }

        #noBtn {
            background-color: #cccccc;
            color: #666666;
        }

        .heart-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .heart {
            color: #ff4b6e;
            font-size: 15rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .back-btn {
            margin-top: 2rem;
            background-color: #ff4b6e;
            color: white;
        }
    </style>
</head>
<body>
    <div class="photo-collage" id="photoCollage">
        <!-- Photos will be added here dynamically -->
    </div>

    <div class="container">
        <h1>Will you be my Valentine? 💝</h1>
        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div class="heart-container" id="heartContainer">
        <div class="heart">❤️</div>
        <button class="back-btn" onclick="hideHeart()">Back</button>
    </div>

    <script>
        // Immediate logging when script loads
        console.log('Script starting...');
        console.log('Window location:', {
            href: window.location.href,
            pathname: window.location.pathname,
            origin: window.location.origin
        });

        // Function to load images with debug logging
        function loadImages() {
            const collage = document.getElementById('photoCollage');
            
            // Debug logging
            console.log('Current pathname:', window.location.pathname);
            console.log('Current URL:', window.location.href);
            console.log('Document location:', document.location.href);
            
            // Try to determine the correct base path
            const repoPath = '/valentines';
            const baseURL = window.location.pathname.includes(repoPath) 
                ? `${repoPath}/images/`
                : './images/';
            
            console.log('Calculated base URL:', baseURL);
            
            const imagePaths = Array.from({length: 12}, (_, i) => {
                const path = `${baseURL}photo${i + 1}.jpg`;
                console.log(`Generated path ${i + 1}:`, path);
                return path;
            });
            console.log('Attempting to load images from paths:', imagePaths);

            imagePaths.forEach((path, index) => {
                const img = document.createElement('img');
                img.src = path;
                img.alt = 'Memories';
                
                // Log success/failure for each image
                img.onload = () => console.log(`Image ${index + 1} loaded successfully:`, path);
                img.onerror = (e) => console.log(`Image ${index + 1} failed to load:`, path, e);
                
                collage.appendChild(img);
            });
        }

        // Load images when page loads
        window.onload = loadImages;

        // Handle No button
        document.getElementById('noBtn').addEventListener('click', function() {
            alert('Wrong answer! Try again 😉');
        });

        // Handle Yes button
        document.getElementById('yesBtn').addEventListener('click', function() {
            document.getElementById('heartContainer').style.display = 'flex';
        });

        // Function to hide heart and return to main screen
        function hideHeart() {
            document.getElementById('heartContainer').style.display = 'none';
        }
    </script>
</body>
</html>
